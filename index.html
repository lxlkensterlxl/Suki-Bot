<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SukiBot // Cyberpunk Companion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            pink: '#ff007f',
                            cyan: '#00f0ff',
                            dark: '#0a0a0f',
                            panel: '#12121a',
                            border: '#2a2a3d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        .glitch-text { text-shadow: 2px 0 #ff007f, -2px 0 #00f0ff; }
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 240, 255, 0.05) 50%, rgba(0, 240, 255, 0.05));
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="bg-cyber-dark text-gray-100 font-mono-tech h-[100dvh] flex flex-col overflow-hidden scanline">

    <!-- Top Navigation HUD -->
    <header class="border-b border-cyber-border bg-cyber-panel/80 backdrop-blur p-3 flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-cyber-cyan animate-pulse"></div>
            <h1 class="text-cyber-cyan tracking-wider font-bold">SUKIBOT // v2.4</h1>
        </div>
        <div id="status-display" class="text-xs text-cyber-pink tracking-widest">[SYS_READY]</div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <!-- Visualizer / Avatar Frame -->
        <div class="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-cyber-border bg-cyber-dark/50 flex flex-col items-center justify-center p-6 relative">
            <div id="avatar-container" class="w-48 h-48 rounded-2xl border-2 border-cyber-pink/50 bg-cyber-panel flex items-center justify-center relative shadow-[0_0_20px_rgba(255,0,127,0.2)] transition-all duration-300">
                <span class="text-6xl select-none">🦊</span>
                <div class="absolute inset-0 border border-cyber-cyan/30 rounded-2xl pointer-events-none"></div>
            </div>
            <div class="mt-4 text-center">
                <p class="text-sm text-cyber-cyan">AURA: <span id="aura-state" class="text-gray-300">STABLE</span></p>
            </div>
        </div>

        <!-- Chat Stream -->
        <section class="flex-1 flex flex-col justify-between overflow-hidden bg-cyber-dark">
            <div id="chat-log" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex flex-col items-start">
                    <span class="text-xs text-cyber-pink mb-1">SUKIBOT // SYSTEM</span>
                    <div class="bg-cyber-panel border border-cyber-border p-3 rounded-lg max-w-[85%] text-sm">
                        Neural interface connected. How can I assist your workflow today, Kmon?
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="p-3 border-t border-cyber-border bg-cyber-panel/80 backdrop-blur">
                <form id="chat-form" class="flex gap-2">
                    <input id="user-input" type="text" placeholder="Enter command or query..." autocomplete="off" class="flex-1 bg-cyber-dark border border-cyber-border rounded px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-cyber-cyan transition-colors">
                    <button type="submit" class="bg-cyber-pink/20 border border-cyber-pink text-cyber-pink px-4 py-2 rounded text-sm hover:bg-cyber-pink hover:text-white transition-all">
                        SEND
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Core Script Logic -->
    <script>
        // Audio Context & Web Audio initialization helper with iOS unlock
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.addEventListener('touchstart', initAudio, { once: true });
        document.addEventListener('click', initAudio, { once: true });

        // Simple terminal interaction handler
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatLog = document.getElementById('chat-log');
        const statusDisplay = document.getElementById('status-display');
        const avatarContainer = document.getElementById('avatar-container');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Append User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'flex flex-col items-end';
            userMsg.innerHTML = `
                <span class="text-xs text-cyber-cyan mb-1">USER // KMON</span>
                <div class="bg-cyber-cyan/10 border border-cyber-cyan/30 p-3 rounded-lg max-w-[85%] text-sm text-gray-100">${escapeHtml(text)}</div>
            `;
            chatLog.appendChild(userMsg);
            userInput.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            // Simulate Bot Response
            statusDisplay.textContent = '[PROCESSING]';
            avatarContainer.classList.add('scale-105', 'shadow-[0_0_30px_rgba(0,240,255,0.4)]');

            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'flex flex-col items-start';
                botMsg.innerHTML = `
                    <span class="text-xs text-cyber-pink mb-1">SUKIBOT // AI</span>
                    <div class="bg-cyber-panel border border-cyber-border p-3 rounded-lg max-w-[85%] text-sm">Processing query sequence: "${escapeHtml(text)}". All systems nominal.</div>
                `;
                chatLog.appendChild(botMsg);
                statusDisplay.textContent = '[SYS_READY]';
                avatarContainer.classList.remove('scale-105', 'shadow-[0_0_30px_rgba(0,240,255,0.4)]');
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 600);
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
