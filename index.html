<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suki Conversational Assistant</title>
  <style>
    /* Suki conversational assistant styles */
    .suki-ai {
      width: min(100% - 32px, 560px);
      margin: 18px auto 28px;
      padding: 18px;
      border: 1px solid rgb(192 132 252 / 28%);
      border-radius: 20px;
      color: #f7f1ff;
      background: linear-gradient(145deg, rgb(38 25 57 / 96%), rgb(20 14 30 / 96%));
      box-shadow: 0 14px 36px rgb(0 0 0 / 20%);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .suki-ai h2,
    .suki-ai h3 {
      margin: 0;
    }

    .suki-ai h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f7f1ff;
      font-size: 1.15rem;
    }

    .suki-settings-btn {
      background: transparent;
      border: 1px solid rgb(192 132 252 / 30%);
      color: #d6a8ff;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .suki-settings-panel {
      display: none;
      margin: 10px 0;
      padding: 10px;
      background: rgb(0 0 0 / 25%);
      border-radius: 10px;
      border: 1px solid rgb(192 132 252 / 20%);
    }

    .suki-settings-panel.open {
      display: block;
    }

    .suki-settings-panel input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgb(192 132 252 / 30%);
      background: rgb(255 255 255 / 5%);
      color: #fff;
      font-size: 0.85rem;
      box-sizing: border-box;
      margin-top: 6px;
    }

    .suki-ai-intro,
    .suki-ai-note,
    #suki-chat-status {
      color: #baaaca;
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .suki-ai-intro {
      margin: 7px 0 14px;
    }

    .suki-chat-log {
      display: flex;
      min-height: 86px;
      max-height: 260px;
      flex-direction: column;
      gap: 9px;
      overflow: auto;
      padding: 12px;
      border: 1px solid rgb(192 132 252 / 15%);
      border-radius: 14px;
      background: rgb(0 0 0 / 14%);
      overscroll-behavior: contain;
    }

    .suki-chat-message {
      max-width: 90%;
      margin: 0;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .suki-chat-message.suki {
      align-self: flex-start;
      border: 1px solid rgb(192 132 252 / 22%);
      background: rgb(192 132 252 / 10%);
    }

    .suki-chat-message.you {
      align-self: flex-end;
      color: #160c22;
      background: linear-gradient(105deg, #d6a8ff, #a879ff);
    }

    .suki-chat-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-top: 10px;
    }

    .suki-chat-form textarea,
    .suki-memory {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid rgb(192 132 252 / 30%);
      border-radius: 12px;
      color: #f7f1ff;
      background: rgb(255 255 255 / 4%);
      font: inherit;
      resize: vertical;
      box-sizing: border-box;
    }

    .suki-chat-form textarea:focus-visible,
    .suki-memory:focus-visible,
    .suki-settings-panel input:focus-visible {
      outline: 2px solid #67e8f9;
      outline-offset: 2px;
    }

    .suki-chat-form button,
    .suki-memory-actions button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: #160c22;
      background: linear-gradient(105deg, #d6a8ff, #a879ff);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .suki-chat-form button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #suki-chat-status {
      min-height: 1.3em;
      margin: 8px 0 12px;
    }

    .suki-ai-note {
      margin: 12px 0 6px;
      font-weight: 700;
    }

    .suki-memory {
      min-height: 66px;
      font-size: 0.85rem;
    }

    .suki-memory-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .suki-memory-actions button:last-child {
      border-color: rgb(192 132 252 / 32%);
      color: #f7f1ff;
      background: transparent;
    }

    @media (max-width: 420px) {
      .suki-chat-form {
        grid-template-columns: 1fr;
      }

      .suki-chat-form button {
        width: 100%;
      }
    }
  </style>
</head>
<body style="background: #0f0a18; margin: 0; padding: 20px;">

  <div class="suki-ai">
    <h2>
      <span>Suki AI Assistant</span>
      <button type="button" class="suki-settings-btn" id="suki-toggle-settings">API Key</button>
    </h2>
    
    <div class="suki-settings-panel" id="suki-settings-panel">
      <label for="suki-api-key" style="font-size: 0.78rem; color: #baaaca;">Gemini API Key:</label>
      <input type="password" id="suki-api-key" placeholder="Paste your Gemini API key here...">
    </div>

    <p class="suki-ai-intro">Hello! I am Suki, your conversational assistant. How can I help you today?</p>
    
    <div class="suki-chat-log" id="suki-chat-log">
      <div class="suki-chat-message suki">Hi there! Ask me anything or configure my memory below.</div>
    </div>

    <div id="suki-chat-status">Ready</div>

    <form class="suki-chat-form" id="suki-chat-form">
      <textarea id="suki-input" placeholder="Type a message to Suki..." rows="1" required></textarea>
      <button type="submit" id="suki-submit">Send</button>
    </form>

    <div class="suki-ai-note">Assistant Memory / Context</div>
    <textarea class="suki-memory" id="suki-memory" placeholder="Add custom instructions or background memory for Suki here..."></textarea>
    
    <div class="suki-memory-actions">
      <button type="button" id="suki-save-memory">Save Memory</button>
      <button type="button" id="suki-clear-memory">Clear</button>
    </div>
  </div>

  <script>
    const chatLog = document.getElementById('suki-chat-log');
    const chatForm = document.getElementById('suki-chat-form');
    const inputField = document.getElementById('suki-input');
    const statusField = document.getElementById('suki-chat-status');
    const memoryField = document.getElementById('suki-memory');
    const saveMemoryBtn = document.getElementById('suki-save-memory');
    const clearMemoryBtn = document.getElementById('suki-clear-memory');
    const apiKeyField = document.getElementById('suki-api-key');
    const toggleSettingsBtn = document.getElementById('suki-toggle-settings');
    const settingsPanel = document.getElementById('suki-settings-panel');

    // Conversation history for multi-turn chat
    let conversationHistory = [];

    // Load saved settings & memory from localStorage
    if (localStorage.getItem('suki_memory')) {
      memoryField.value = localStorage.getItem('suki_memory');
    }
    if (localStorage.getItem('suki_gemini_key')) {
      apiKeyField.value = localStorage.getItem('suki_gemini_key');
    }

    toggleSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.toggle('open');
    });

    apiKeyField.addEventListener('input', () => {
      localStorage.setItem('suki_gemini_key', apiKeyField.value.trim());
    });

    saveMemoryBtn.addEventListener('click', () => {
      localStorage.setItem('suki_memory', memoryField.value);
      statusField.textContent = 'Memory saved successfully!';
      setTimeout(() => { statusField.textContent = 'Ready'; }, 2000);
    });

    clearMemoryBtn.addEventListener('click', () => {
      memoryField.value = '';
      localStorage.removeItem('suki_memory');
      statusField.textContent = 'Memory cleared.';
      setTimeout(() => { statusField.textContent = 'Ready'; }, 2000);
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = inputField.value.trim();
      if (!text) return;

      const apiKey = apiKeyField.value.trim();
      if (!apiKey) {
        settingsPanel.classList.add('open');
        statusField.textContent = 'Please enter your Gemini API key above.';
        apiKeyField.focus();
        return;
      }

      // Append user message
      appendMessage(text, 'you');
      conversationHistory.push({ role: 'user', parts: [{ text: text }] });
      inputField.value = '';
      statusField.textContent = 'Suki is thinking...';

      try {
        const systemInstructionContent = memoryField.value.trim();
        const payload = {
          contents: conversationHistory
        };

        if (systemInstructionContent) {
          payload.systemInstruction = {
            parts: [{ text: systemInstructionContent }]
          };
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'API request failed');
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
        appendMessage(reply, 'suki');
        conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
        statusField.textContent = 'Ready';
      } catch (error) {
        appendMessage(`Error: ${error.message}`, 'suki');
        statusField.textContent = 'Error connecting to brain.';
      }
    });

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `suki-chat-message ${sender}`;
      msg.textContent = text;
      chatLog.appendChild(msg);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  </script>
</body>
</html>
