<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUKI // NEKO-HUD</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Rajdhani & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            sans: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            cyber: {
              pink: '#ff2a8d',
              cyan: '#00f3ff',
              purple: '#ab00ff',
              dark: '#0a0814',
              card: '#131126',
              border: '#2e2654',
            }
          },
          boxShadow: {
            'pink-glow': '0 0 15px rgba(255, 42, 141, 0.5)',
            'cyan-glow': '0 0 15px rgba(0, 243, 255, 0.5)',
            'purple-glow': '0 0 20px rgba(171, 0, 255, 0.3)',
          }
        }
      }
    }
  </script>

  <style>
    /* Crisp sub-pixel rendering & mobile optimizations */
    canvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      touch-action: none;
    }
    
    /* Cyberpunk custom scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0814;
    }
    ::-webkit-scrollbar-thumb {
      background: #ff2a8d;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f3ff;
    }

    /* Scanline visual overlay effect */
    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 38, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    
    /* Subtle neon pulse animation */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 8px rgba(255, 42, 141, 0.6)); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(0, 243, 255, 0.8)); }
    }
    .neon-pulse {
      animation: pulseGlow 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between select-none font-mono antialiased overflow-hidden bg-cyber-dark text-slate-200">

  <!-- HUD Container -->
  <div class="max-w-md w-full mx-auto h-full flex flex-col justify-between p-3 relative scanlines border-x border-cyber-border/40 bg-gradient-to-b from-cyber-dark via-[#0d091e] to-cyber-dark">
    
    <!-- TOP HEADER -->
    <header class="flex items-center justify-between py-2 px-3 bg-cyber-card/80 border border-cyber-border rounded-xl backdrop-blur-md shadow-purple-glow">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-cyber-pink animate-ping"></span>
        <h1 class="font-sans font-bold text-lg tracking-wider text-slate-100 flex items-center gap-1.5">
          SUKI<span class="text-cyber-pink">//</span>NEKO-HUD
        </h1>
      </div>
      
      <div class="flex items-center gap-3 text-xs text-cyber-cyan">
        <span id="clock" class="tracking-widest">00:00:00</span>
        <div class="flex items-center gap-1 bg-cyber-cyan/10 px-2 py-0.5 rounded border border-cyber-cyan/30">
          <span class="w-1.5 h-1.5 rounded-full bg-cyber-cyan animate-pulse"></span>
          <span class="text-[10px]">SYNCED</span>
        </div>
        <button id="soundToggleBtn" class="text-slate-400 hover:text-cyber-cyan transition-colors" title="Toggle UI Audio">
          <i class="fas fa-volume-high text-sm"></i>
        </button>
      </div>
    </header>

    <!-- MAIN VIEWPORT CONTAINER -->
    <main class="flex-1 flex flex-col gap-3 my-2 min-h-0 overflow-y-auto">
      
      <!-- AVATAR CANVAS STAGE -->
      <section class="relative bg-cyber-card/90 border border-cyber-border rounded-2xl p-2 flex flex-col items-center justify-between shadow-purple-glow overflow-hidden">
        
        <!-- Status Pill Indicators -->
        <div class="w-full flex justify-between items-center px-2 py-1 text-[11px] font-semibold z-10">
          <div class="bg-cyber-dark/80 px-2.5 py-1 rounded-full border border-cyber-pink/40 text-cyber-pink">
            MODE: <span id="currentModeText" class="text-slate-100 font-bold">IDLE // PATROL</span>
          </div>
          <div class="bg-cyber-dark/80 px-2.5 py-1 rounded-full border border-cyber-cyan/40 text-cyber-cyan">
            EXPRESSION: <span id="currentExprText" class="text-slate-100 font-bold">SMILING</span>
          </div>
        </div>

        <!-- High-DPI Crisp Canvas Frame -->
        <div class="relative w-full flex-1 min-h-[220px] max-h-[300px] flex items-center justify-center my-1">
          <canvas id="sukiCanvas" class="w-full h-full rounded-xl cursor-pointer"></canvas>
          
          <!-- Subtle Floating Background Grid -->
          <div class="absolute inset-0 pointer-events-none border border-cyber-cyan/10 rounded-xl bg-[linear-gradient(to_right,#00f3ff0a_1px,transparent_1px),linear-gradient(to_bottom,#00f3ff0a_1px,transparent_1px)] bg-[size:16px_16px]"></div>
        </div>

        <!-- Action Control Buttons Grid -->
        <div class="w-full grid grid-cols-3 gap-2 z-10 pt-1">
          <button onclick="triggerAction('walk')" class="action-btn flex items-center justify-center gap-1.5 py-2 px-2 bg-cyber-dark/90 border border-cyber-cyan/40 hover:border-cyber-cyan text-cyber-cyan hover:bg-cyber-cyan/10 rounded-xl text-xs font-sans font-bold transition-all active:scale-95">
            <i class="fas fa-shoe-prints"></i> Walk
          </button>
          <button onclick="triggerAction('greet')" class="action-btn flex items-center justify-center gap-1.5 py-2 px-2 bg-cyber-dark/90 border border-cyber-pink/40 hover:border-cyber-pink text-cyber-pink hover:bg-cyber-pink/10 rounded-xl text-xs font-sans font-bold transition-all active:scale-95">
            <i class="fas fa-smile-beam"></i> Greet
          </button>
          <button onclick="triggerAction('slash')" class="action-btn flex items-center justify-center gap-1.5 py-2 px-2 bg-cyber-dark/90 border border-purple-500/40 hover:border-purple-400 text-purple-300 hover:bg-purple-500/10 rounded-xl text-xs font-sans font-bold transition-all active:scale-95">
            <i class="fas fa-wand-magic-sparkles"></i> Katana
          </button>
          <button onclick="triggerAction('spin')" class="action-btn col-span-3 flex items-center justify-center gap-2 py-2 px-3 bg-gradient-to-r from-cyber-pink/20 via-cyber-purple/20 to-cyber-cyan/20 border border-cyber-cyan/60 hover:border-cyber-cyan text-slate-100 rounded-xl text-xs font-sans font-bold transition-all active:scale-95 shadow-cyan-glow">
            <i class="fas fa-atom text-cyber-cyan animate-spin"></i> Plasma Spin
          </button>
        </div>
      </section>

      <!-- AI ASSISTANT DIALOGUE BANNER -->
      <section class="bg-cyber-card/90 border border-cyber-border rounded-xl p-3 shadow-purple-glow">
        <div class="flex items-center justify-between text-xs text-cyber-pink mb-1">
          <span class="flex items-center gap-1.5 font-bold">
            <i class="fas fa-robot text-cyber-cyan"></i> SUKI // NEKO-AI:
          </span>
          <span class="text-[10px] text-slate-500 tracking-widest">v2.0.4</span>
        </div>
        <p id="sukiSpeech" class="text-xs text-slate-200 leading-relaxed font-sans font-semibold min-h-[32px] transition-all">
          System online. High-DPI canvas renderer synced with sub-pixel perfection. Ready for your command!
        </p>
      </section>

      <!-- SYSTEM INTERACTION LOG FEED -->
      <section class="bg-cyber-card/80 border border-cyber-border rounded-xl p-2.5 flex-1 flex flex-col justify-between overflow-hidden shadow-inner">
        <div class="flex justify-between items-center text-[11px] text-slate-400 border-b border-cyber-border/40 pb-1 mb-1.5">
          <span class="text-cyber-cyan font-bold">SYS_LOG // INTERACTION_FEED</span>
          <button onclick="clearLog()" class="hover:text-cyber-pink text-[10px] transition-colors">CLEAR LOG</button>
        </div>
        <div id="logFeed" class="flex-1 overflow-y-auto text-[11px] space-y-1 pr-1 font-mono">
          <!-- Dynamic Log Entries -->
        </div>
      </section>
      
    </main>

    <!-- CHAT INPUT CONTROLLER -->
    <footer class="pt-1">
      <form id="chatForm" onsubmit="handleSend(event)" class="flex items-center gap-2">
        <button type="button" onclick="triggerAction('greet')" class="p-3 bg-cyber-card border border-cyber-border hover:border-cyber-pink text-cyber-pink rounded-xl flex items-center justify-center transition-all active:scale-90">
          <i class="fas fa-microphone"></i>
        </button>
        <input 
          id="chatInput"
          type="text" 
          placeholder="Talk to Suki or give command..."
          class="flex-1 bg-cyber-card/90 border border-cyber-border focus:border-cyber-cyan text-slate-100 placeholder-slate-500 rounded-xl px-3 py-2.5 text-xs outline-none transition-all font-sans"
        />
        <button 
          type="submit" 
          class="p-3 bg-gradient-to-r from-cyber-pink to-cyber-purple hover:brightness-125 text-white rounded-xl flex items-center justify-center transition-all shadow-pink-glow active:scale-95">
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </footer>

  </div>

  <!-- SCRIPT CONTROLLER & HIGH-DPI CANVAS ENGINE -->
  <script>
    // --- GLOBAL STATE ---
    let soundEnabled = true;
    let currentMode = 'IDLE';
    let currentExpression = 'HAPPY';
    let animationTime = 0;
    let actionState = 'idle'; // idle, walk, greet, slash, spin
    let actionTimer = 0;

    // --- AUDIO SYSTEM (Web Audio API Synthesizer) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type, duration, vol = 0.1) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSfx(type) {
      if (!soundEnabled) return;
      if (type === 'btn') {
        playTone(600, 'sine', 0.08, 0.05);
        setTimeout(() => playTone(900, 'sine', 0.08, 0.04), 40);
      } else if (type === 'slash') {
        playTone(300, 'sawtooth', 0.15, 0.08);
        setTimeout(() => playTone(150, 'triangle', 0.2, 0.06), 60);
      } else if (type === 'spin') {
        for (let i = 0; i < 5; i++) {
          setTimeout(() => playTone(400 + i * 150, 'sine', 0.1, 0.04), i * 40);
        }
      } else if (type === 'greet') {
        playTone(523.25, 'sine', 0.1, 0.06); // C5
        setTimeout(() => playTone(659.25, 'sine', 0.15, 0.06), 80); // E5
      }
    }

    document.getElementById('soundToggleBtn').addEventListener('click', function() {
      soundEnabled = !soundEnabled;
      this.innerHTML = soundEnabled 
        ? '<i class="fas fa-volume-high text-sm text-cyber-cyan"></i>' 
        : '<i class="fas fa-volume-xmark text-sm text-slate-500"></i>';
      addLog('SYSTEM', soundEnabled ? 'Audio feedback unmuted.' : 'Audio feedback muted.');
    });

    // --- HIGH-DPI CANVAS SETUP & CRISP GRAPHICS ENGINE ---
    const canvas = document.getElementById('sukiCanvas');
    const ctx = canvas.getContext('2d');
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      
      // Set buffer display size scaled for crisp Retina Rendering
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      
      // Ensure smooth vector crisping on dynamic screens
      ctx.imageSmoothingEnabled = false;
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    // --- ANIMATION & SUKI CANVAS GRAPHICS RENDERER ---
    function renderSuki() {
      animationTime += 0.05;
      if (actionTimer > 0) {
        actionTimer--;
        if (actionTimer === 0) {
          actionState = 'idle';
          setMode('IDLE // PATROL', 'SMILING');
        }
      }

      const width = canvas.width;
      const height = canvas.height;

      // Clear viewport
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      // Normalize scaling factor for High-DPI screen coordinates
      const scale = (height / 280);
      const centerX = width / 2;
      const centerY = height / 2 + 10 * scale;

      // Draw Ground Glow Shadow
      const shadowGlow = ctx.createRadialGradient(centerX, centerY + 80 * scale, 5 * scale, centerX, centerY + 80 * scale, 50 * scale);
      shadowGlow.addColorStop(0, 'rgba(171, 0, 255, 0.4)');
      shadowGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = shadowGlow;
      ctx.beginPath();
      ctx.ellipse(centerX, centerY + 80 * scale, 45 * scale, 12 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dynamic Motion Offsets
      let bounceY = Math.sin(animationTime * 3) * 4 * scale;
      let legAngle = 0;
      let armLeftAngle = 0;
      let armRightAngle = 0;
      let shurikenAngle = animationTime * 4;

      if (actionState === 'walk') {
        legAngle = Math.sin(animationTime * 8) * 0.4;
        bounceY = Math.abs(Math.sin(animationTime * 8)) * 6 * scale;
        armLeftAngle = -legAngle;
        armRightAngle = legAngle;
      } else if (actionState === 'greet') {
        armRightAngle = -Math.PI / 1.5 + Math.sin(animationTime * 10) * 0.15;
      } else if (actionState === 'slash') {
        armRightAngle = -Math.PI / 1.2 + Math.cos(animationTime * 15) * 0.5;
        bounceY -= 10 * scale;
      } else if (actionState === 'spin') {
        shurikenAngle = animationTime * 18;
        bounceY += Math.sin(animationTime * 12) * 8 * scale;
      }

      const charY = centerY + bounceY;

      // 1. Draw Legs (Sharp Cyber Pants)
      ctx.lineWidth = 8 * scale;
      ctx.strokeStyle = '#1a1633';
      ctx.lineCap = 'round';

      // Left Leg
      ctx.beginPath();
      ctx.moveTo(centerX - 12 * scale, charY + 35 * scale);
      ctx.lineTo(centerX - 16 * scale + Math.sin(legAngle) * 15 * scale, charY + 75 * scale);
      ctx.stroke();

      // Right Leg
      ctx.beginPath();
      ctx.moveTo(centerX + 12 * scale, charY + 35 * scale);
      ctx.lineTo(centerX + 16 * scale - Math.sin(legAngle) * 15 * scale, charY + 75 * scale);
      ctx.stroke();

      // Boots Glowing Accents
      ctx.fillStyle = '#ff2a8d';
      ctx.beginPath();
      ctx.arc(centerX - 16 * scale + Math.sin(legAngle) * 15 * scale, charY + 74 * scale, 4 * scale, 0, Math.PI * 2);
      ctx.arc(centerX + 16 * scale - Math.sin(legAngle) * 15 * scale, charY + 74 * scale, 4 * scale, 0, Math.PI * 2);
      ctx.fill();

      // 2. Torso & Cyber Armor
      ctx.fillStyle = '#141226';
      ctx.strokeStyle = '#ff2a8d';
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.roundRect(centerX - 18 * scale, charY - 10 * scale, 36 * scale, 48 * scale, 8 * scale);
      ctx.fill();
      ctx.stroke();

      // Neon Belt
      ctx.fillStyle = '#00f3ff';
      ctx.fillRect(centerX - 18 * scale, charY + 22 * scale, 36 * scale, 4 * scale);

      // 3. Arms & Weapon
      // Left Arm
      ctx.save();
      ctx.translate(centerX - 18 * scale, charY - 2 * scale);
      ctx.rotate(armLeftAngle);
      ctx.fillStyle = '#2a224a';
      ctx.fillRect(-5 * scale, 0, 8 * scale, 32 * scale);
      ctx.restore();

      // Right Arm (Holding Katana or Waving)
      ctx.save();
      ctx.translate(centerX + 18 * scale, charY - 2 * scale);
      ctx.rotate(armRightAngle);
      ctx.fillStyle = '#2a224a';
      ctx.fillRect(-3 * scale, 0, 8 * scale, 32 * scale);

      // Cyber Katana Slash Graphic
      if (actionState === 'slash' || actionState === 'idle') {
        ctx.strokeStyle = '#00f3ff';
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 12 * scale;
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.moveTo(2 * scale, 25 * scale);
        ctx.lineTo(25 * scale, -30 * scale);
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset Shadow
      }
      ctx.restore();

      // Katana Arc Energy Slice Effect
      if (actionState === 'slash') {
        ctx.strokeStyle = '#ab00ff';
        ctx.shadowColor = '#ff2a8d';
        ctx.shadowBlur = 18 * scale;
        ctx.lineWidth = 4 * scale;
        ctx.beginPath();
        ctx.arc(centerX + 10 * scale, charY - 10 * scale, 45 * scale, -Math.PI / 4, Math.PI / 3);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // 4. Suki Head & Neko Ears
      const headY = charY - 30 * scale;

      // Neko Cyber Ears (Glow Edges)
      ctx.fillStyle = '#281a45';
      ctx.strokeStyle = '#ff2a8d';
      ctx.lineWidth = 2 * scale;

      // Left Ear
      ctx.beginPath();
      ctx.moveTo(centerX - 24 * scale, headY - 10 * scale);
      ctx.lineTo(centerX - 35 * scale, headY - 45 * scale);
      ctx.lineTo(centerX - 10 * scale, headY - 24 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Right Ear
      ctx.beginPath();
      ctx.moveTo(centerX + 24 * scale, headY - 10 * scale);
      ctx.lineTo(centerX + 35 * scale, headY - 45 * scale);
      ctx.lineTo(centerX + 10 * scale, headY - 24 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Inner Ear Neon Inset
      ctx.fillStyle = '#ff2a8d';
      ctx.beginPath();
      ctx.moveTo(centerX - 22 * scale, headY - 14 * scale);
      ctx.lineTo(centerX - 30 * scale, headY - 36 * scale);
      ctx.lineTo(centerX - 14 * scale, headY - 23 * scale);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(centerX + 22 * scale, headY - 14 * scale);
      ctx.lineTo(centerX + 30 * scale, headY - 36 * scale);
      ctx.lineTo(centerX + 14 * scale, headY - 23 * scale);
      ctx.closePath();
      ctx.fill();

      // Head Base Shape
      ctx.fillStyle = '#311b58';
      ctx.beginPath();
      ctx.arc(centerX, headY, 26 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Anime Hair (Front Fringe)
      ctx.fillStyle = '#4c2885';
      ctx.beginPath();
      ctx.arc(centerX, headY - 4 * scale, 26 * scale, Math.PI, Math.PI * 2);
      ctx.lineTo(centerX + 18 * scale, headY);
      ctx.lineTo(centerX, headY + 5 * scale);
      ctx.lineTo(centerX - 18 * scale, headY);
      ctx.closePath();
      ctx.fill();

      // Visor / Anime Glowing Eyes
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 10 * scale;
      ctx.fillStyle = '#00f3ff';

      if (currentExpression === 'WINK') {
        // Left Eye (Open)
        ctx.beginPath();
        ctx.arc(centerX - 10 * scale, headY + 2 * scale, 4 * scale, 0, Math.PI * 2);
        ctx.fill();
        // Right Eye (Wink Arch)
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2.5 * scale;
        ctx.beginPath();
        ctx.arc(centerX + 10 * scale, headY + 3 * scale, 5 * scale, Math.PI, 0);
        ctx.stroke();
      } else {
        // Smiling Curved Eyes
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.arc(centerX - 10 * scale, headY + 2 * scale, 5 * scale, Math.PI * 0.1, Math.PI * 0.9, true);
        ctx.arc(centerX + 10 * scale, headY + 2 * scale, 5 * scale, Math.PI * 0.1, Math.PI * 0.9, true);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // Cute Blush Marks
      ctx.fillStyle = 'rgba(255, 42, 141, 0.6)';
      ctx.beginPath();
      ctx.ellipse(centerX - 14 * scale, headY + 10 * scale, 4 * scale, 2 * scale, 0, 0, Math.PI * 2);
      ctx.ellipse(centerX + 14 * scale, headY + 10 * scale, 4 * scale, 2 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // 5. Floating Plasma Shuriken Weapon (Sharp Canvas Geometry)
      ctx.save();
      const shurikenDistX = 45 * scale;
      const shurikenDistY = -15 * scale + Math.sin(animationTime * 2) * 6 * scale;
      ctx.translate(centerX + shurikenDistX, charY + shurikenDistY);
      ctx.rotate(shurikenAngle);

      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 14 * scale;
      ctx.fillStyle = 'rgba(0, 243, 255, 0.85)';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5 * scale;

      // Draw 4 Star Blades
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-6 * scale, -8 * scale);
        ctx.lineTo(0, -22 * scale);
        ctx.lineTo(6 * scale, -8 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Shuriken Center Core
      ctx.fillStyle = '#ff2a8d';
      ctx.beginPath();
      ctx.arc(0, 0, 5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
      requestAnimationFrame(renderSuki);
    }

    // Start Render Loop
    requestAnimationFrame(renderSuki);

    // --- CONTROLLER FUNCTIONS & INTERACTION ---
    function setMode(mode, expr) {
      currentMode = mode;
      currentExpression = expr;
      document.getElementById('currentModeText').innerText = mode;
      document.getElementById('currentExprText').innerText = expr;
    }

    function setSpeech(text) {
      const speechEl = document.getElementById('sukiSpeech');
      speechEl.style.opacity = 0;
      setTimeout(() => {
        speechEl.innerText = text;
        speechEl.style.opacity = 1;
      }, 150);
    }

    function addLog(sender, text) {
      const feed = document.getElementById('logFeed');
      const time = new Date().toLocaleTimeString().split(' ')[0];
      const entry = document.createElement('div');
      entry.className = 'flex gap-1.5 leading-tight';
      
      const isSys = sender === 'SYSTEM';
      const colorClass = isSys ? 'text-cyber-cyan' : 'text-cyber-pink';
      
      entry.innerHTML = `<span class="text-slate-600">[${time}]</span> <span class="${colorClass} font-bold">&gt; [${sender}]</span> <span class="text-slate-300">${text}</span>`;
      feed.appendChild(entry);
      feed.scrollTop = feed.scrollHeight;
    }

    function triggerAction(action) {
      playSfx(action === 'slash' ? 'slash' : action === 'spin' ? 'spin' : action === 'greet' ? 'greet' : 'btn');
      actionState = action;

      if (action === 'walk') {
        actionTimer = 140;
        setMode('WALKING // PATROL', 'ALERT');
        setSpeech("Initiating patrol sequence. Locomotion servos running smoothly.");
        addLog('SUKI', 'Executing walking routine. Sector clear.');
      } else if (action === 'greet') {
        actionTimer = 100;
        setMode('INTERACT // GREET', 'WINK');
        setSpeech("Konnichiwa! High-DPI canvas graphics synchronized!");
        addLog('SUKI', 'Greeting user with festive gesture.');
      } else if (action === 'slash') {
        actionTimer = 90;
        setMode('COMBAT // KATANA', 'FOCUSED');
        setSpeech("Katana slash initialized! Plasma blade edge calibrated.");
        addLog('SUKI', 'Katana slash maneuver completed successfully.');
      } else if (action === 'spin') {
        actionTimer = 160;
        setMode('OVERCLOCK // SPIN', 'HYPER');
        setSpeech("Overclocking floating plasma shuriken! Kinetic energy stabilized.");
        addLog('SUKI', 'Plasma shuriken spin synchronized at maximum RPM.');
      }
    }

    function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      playSfx('btn');
      addLog('USER', text);
      input.value = '';

      const lower = text.toLowerCase();
      setTimeout(() => {
        if (lower.includes('walk') || lower.includes('move') || lower.includes('run')) {
          triggerAction('walk');
        } else if (lower.includes('hello') || lower.includes('hi') || lower.includes('greet') || lower.includes('smile')) {
          triggerAction('greet');
        } else if (lower.includes('slash') || lower.includes('katana') || lower.includes('sword') || lower.includes('attack')) {
          triggerAction('slash');
        } else if (lower.includes('spin') || lower.includes('plasma') || lower.includes('shuriken')) {
          triggerAction('spin');
        } else if (lower.includes('clear')) {
          clearLog();
        } else {
          playSfx('greet');
          actionState = 'greet';
          actionTimer = 80;
          setMode('CHAT // RESPONSE', 'SMILING');
          setSpeech(`Received: "${text}". All systems operating at peak efficiency!`);
          addLog('SUKI', `Processed command query: '${text}'`);
        }
      }, 250);
    }

    function clearLog() {
      playSfx('btn');
      document.getElementById('logFeed').innerHTML = '';
      addLog('SYSTEM', 'Interaction log cleared.');
    }

    // --- REALTIME HUD CLOCK ---
    function updateClock() {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      document.getElementById('clock').innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Initial Logs
    addLog('SYSTEM', 'Suki engine loaded. Voice recognition and locomotion ready.');
    addLog('SYSTEM', 'Retina screen sub-pixel rendering crisp edges activated.');
  </script>
</body>
</html>
