<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SukiBot companion console">
  <title>SukiBot — Companion Console</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512.svg">
  <link rel="stylesheet" href="./tailwind.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="min-h-screen overflow-hidden bg-suki-bg text-suki-text antialiased">
  <canvas id="matrix-canvas" class="fixed inset-0 z-0 h-screen w-screen pointer-events-none opacity-0 transition-opacity duration-200 [&.visible]:opacity-100" aria-hidden="true"></canvas>
  <main class="relative z-[1] mx-auto flex min-h-dvh w-full max-w-[460px] flex-col gap-[14px] px-[14px] pt-[calc(12px+env(safe-area-inset-top))] pb-[calc(18px+env(safe-area-inset-bottom))] max-[430px]:px-[max(12px,env(safe-area-inset-left))] max-[430px]:pr-[max(12px,env(safe-area-inset-right))] max-[360px]:gap-3 max-[360px]:pt-[calc(10px+env(safe-area-inset-top))]">
    <header class="flex w-full items-center justify-between gap-2 rounded-2xl border border-suki-border-soft bg-[rgb(12_7_20_/_66%)] px-3 py-2 shadow-[0_0_18px_rgb(189_0_255_/_18%)] backdrop-blur-[10px] max-[430px]:gap-1.5 max-[430px]:pl-2.5 max-[430px]:pr-2">
      <div class="inline-flex items-center gap-2 text-[0.95rem] font-extrabold tracking-[0.14em] max-[430px]:gap-1.5 max-[430px]:text-[0.82rem] max-[430px]:tracking-[0.12em]">
        <span class="inline-grid h-[22px] w-[22px] shrink-0 place-items-center text-neon-cyan drop-shadow-[0_0_12px_rgb(103_232_249_/_80%)]" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 3.5 19.2 12.8 28.5 16l-9.3 3.2L16 28.5l-3.2-9.3L3.5 16l9.3-3.2L16 3.5Z" fill="currentColor"/>
            <circle cx="16" cy="16" r="3.1" fill="#120a2a"/>
            <path d="m25.4 4.2.9 2.5 2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9.9-2.5Z" fill="#67e8f9"/>
          </svg>
        </span>
        <span>SUKI<span class="text-neon-cyan">BOT</span></span>
      </div>
      <span class="inline-flex items-center gap-2 text-[0.72rem] font-extrabold tracking-[0.18em] text-neon-cyan max-[430px]:tracking-[0.12em]"><i class="inline-block h-2 w-2 rounded-full bg-[#80ffce] shadow-[0_0_12px_rgb(128_255_206_/_80%)]"></i> READY</span>
      <button id="open-settings" class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl border border-suki-border-soft bg-white/[0.03] text-[1.2rem] text-suki-text" type="button" aria-label="Open settings">⚙</button>
    </header>

    <section class="grid gap-1.5 px-1">
      <p class="m-0 text-[0.7rem] font-bold tracking-[0.2em] text-suki-muted">PERSONAL COMPANION // v2.6</p>
      <h1 class="m-0 text-[clamp(2.05rem,6vw,3rem)] leading-[0.98] tracking-[-0.05em]">Hey there, <span class="text-neon-cyan">Senpai.</span></h1>
      <p class="m-0 text-[0.95rem] text-suki-muted">Your neon companion is ready.</p>
    </section>

    <section class="grid grid-cols-[76px_minmax(0,1fr)] items-center gap-3 rounded-2xl border border-suki-border bg-suki-panel p-3.5 shadow-[inset_0_0_12px_rgb(189_0_255_/_12%),0_0_18px_rgb(189_0_255_/_14%)] backdrop-blur-xl min-[431px]:grid-cols-[96px_minmax(0,1fr)] max-[360px]:p-3" aria-label="SukiBot status">
      <canvas id="suki-avatar-canvas" class="block h-[76px] w-[76px] rounded-[18px] border border-suki-border-soft bg-[radial-gradient(circle_at_35%_30%,rgb(103_232_249_/_32%),rgb(27_20_38_/_40%)_42%,rgb(9_6_17_/_78%)_70%)] min-[431px]:h-24 min-[431px]:w-24" role="img" aria-label="Suki, your animated companion. Tap or move over her to guide her; use the arrow keys when focused." tabindex="0"></canvas>
      <div class="min-w-0"><p class="m-0 text-[0.7rem] font-bold tracking-[0.2em] text-suki-muted">SUKI / <span id="mode-display">CORE</span></p><h2 id="greeting" class="m-0 text-[clamp(1.1rem,4vw,1.5rem)] tracking-[0.06em]">Systems online!</h2><p class="mt-1.5 mb-0 text-[0.87rem] text-suki-muted">A friendly little console for your day.</p></div>
    </section>

    <section class="rounded-2xl border border-suki-border bg-suki-panel p-3.5 shadow-[inset_0_0_12px_rgb(189_0_255_/_12%),0_0_18px_rgb(189_0_255_/_14%)] backdrop-blur-xl max-[360px]:p-3" aria-labelledby="transmission-title">
      <div class="mb-2.5 flex items-center justify-between gap-2.5"><h2 id="transmission-title" class="m-0 text-[0.86rem] tracking-[0.18em]">TRANSMISSION</h2><span id="synapse-clock" class="text-[0.72rem] tracking-[0.08em] text-suki-muted">--:-- UTC</span></div>
      <p id="speech-box" class="m-0 min-h-[3.2em] leading-6" aria-live="polite">Nya! Suki is online and ready to help.</p>
      <div class="mt-3 flex gap-2 max-[430px]:flex-col">
        <button id="btn-transmit" class="min-h-[42px] flex-1 rounded-2xl border border-transparent bg-gradient-to-br from-[#d7a8ff] to-[#9e7dff] px-3 font-bold text-[#160c22]" type="button">↻ &nbsp;Transmit</button>
        <button id="btn-voice" class="min-h-[42px] flex-1 rounded-2xl border border-suki-border-soft bg-white/[0.03] px-3 font-bold text-suki-text max-[430px]:w-full" type="button">♫ &nbsp;Speak</button>
      </div>
    </section>

    <section class="rounded-2xl border border-suki-border bg-suki-panel p-3.5 shadow-[inset_0_0_12px_rgb(189_0_255_/_12%),0_0_18px_rgb(189_0_255_/_14%)] backdrop-blur-xl max-[360px]:p-3" aria-labelledby="modes-title">
      <div class="mb-2.5 flex items-center justify-between gap-2.5"><h2 id="modes-title" class="m-0 text-[0.86rem] tracking-[0.18em]">QUICK MODES</h2><span class="text-[0.72rem] tracking-[0.08em] text-suki-muted">Tap to switch</span></div>
      <div class="mt-2 grid grid-cols-2 gap-2">
        <button class="mode-button min-h-[46px] rounded-2xl border border-suki-border-soft bg-white/[0.018] font-bold tracking-[0.08em] text-suki-text" type="button" data-mode="ASR" aria-pressed="false"><span>◉</span> ASR</button>
        <button class="mode-button min-h-[46px] rounded-2xl border border-suki-border-soft bg-white/[0.018] font-bold tracking-[0.08em] text-suki-text" type="button" data-mode="ORB" aria-pressed="false"><span>◌</span> Orb</button>
        <button class="mode-button mode-active min-h-[46px] rounded-2xl border border-suki-border-soft bg-white/[0.018] font-bold tracking-[0.08em] text-suki-text" type="button" data-mode="CORE" aria-pressed="true"><span>✧</span> Core</button>
        <button class="mode-button min-h-[46px] rounded-2xl border border-suki-border-soft bg-white/[0.018] font-bold tracking-[0.08em] text-suki-text" type="button" data-mode="TACTICS" aria-pressed="false"><span>⌁</span> Tactics</button>
      </div>
    </section>

    <footer class="flex items-center justify-between gap-3 px-1 text-[0.76rem] tracking-[0.08em] text-suki-muted"><span><i class="mr-2 inline-block h-2 w-2 rounded-full bg-[#7cf2b9] shadow-[0_0_8px_rgb(124_242_185_/_70%)]"></i>All systems local</span><span id="energy-display">100% energy</span></footer>
  </main>

  <dialog id="settings-dialog" class="m-auto w-[min(calc(100vw-24px),420px)] rounded-2xl border border-suki-border bg-[rgb(12_7_20_/_90%)] p-0 text-suki-text backdrop-blur-xl" aria-labelledby="settings-title">
    <form method="dialog" class="grid gap-3 p-3.5">
      <div class="mb-2.5 flex items-center justify-between gap-2.5"><h2 id="settings-title" class="m-0 text-[0.86rem] tracking-[0.18em]">SETTINGS</h2><button class="close-button grid h-9 w-9 place-items-center rounded-2xl border border-suki-border-soft bg-white/[0.03] text-[1.2rem]" value="close" aria-label="Close settings">×</button></div>
      <label class="flex items-center justify-between gap-3 text-[0.88rem]" for="voice-pitch">Voice pitch <output id="pitch-value">1.0</output></label>
      <input class="w-full accent-neon-cyan" id="voice-pitch" type="range" min="0.5" max="2" step="0.1" value="1">
      <label class="flex items-center justify-between gap-3 text-[0.88rem]" for="voice-rate">Speaking speed <output id="rate-value">1.0</output></label>
      <input class="w-full accent-neon-cyan" id="voice-rate" type="range" min="0.5" max="1.8" step="0.1" value="1">
      <label class="flex items-center justify-between gap-3 text-[0.88rem]" for="matrix-toggle"><span>Matrix background</span><input id="matrix-toggle" type="checkbox" class="h-5 w-5 accent-neon-cyan"></label>
      <label class="flex items-center justify-between gap-3 text-[0.88rem]" for="theme-toggle"><span>Light mode</span><input id="theme-toggle" type="checkbox" class="h-5 w-5 accent-neon-cyan"></label>
      <button class="mt-1 min-h-[42px] rounded-2xl bg-gradient-to-br from-[#d7a8ff] to-[#9e7dff] px-3 font-bold text-[#160c22]" value="done">Done</button>
    </form>
  </dialog>

  <script src="./suki-audio.js"></script>
  <script src="./suki-renderer.js"></script>
  <script src="./suki-walk.js"></script>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const messages = [
        'Nya! Suki is online and ready to help.',
        'Tactical update: your next great idea is one small step away.',
        'Kitty matrix online. Remember to take a stretch break too.',
        'Energy core glowing! What would you like to build today?'
      ];
      let messageIndex = 0;
      let matrixFrame = 0;
      let matrixDrops = [];
      const canvas = $('matrix-canvas');
      const ctx = canvas.getContext('2d');
      const dialog = $('settings-dialog');
      const themeToggle = $('theme-toggle');
      const store = {
        get(key) { try { return localStorage.getItem(key); } catch (_) { return null; } },
        set(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
      };

      function applyTheme(isLight) {
        const theme = isLight ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        if (themeToggle) themeToggle.checked = isLight;
        store.set('suki_theme', theme);
      }

      function beep() {
        try { if (window.sound) window.sound.playBeep(); } catch (_) {}
      }
      function setMode(mode) {
        mode = String(mode || 'CORE').toUpperCase();
        $('mode-display').textContent = mode;
        document.querySelectorAll('.mode-button').forEach((button) => {
          const active = button.dataset.mode === mode;
          button.classList.toggle('mode-active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        store.set('suki_mode', mode);
        beep();
      }
      function updateClock() {
        const now = new Date();
        $('synapse-clock').textContent = `${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')} UTC`;
      }
      $('btn-transmit').addEventListener('click', () => {
        messageIndex = (messageIndex + 1) % messages.length;
        $('speech-box').textContent = messages[messageIndex];
        $('greeting').textContent = 'Transmission received!';
        beep();
      });
      $('btn-voice').addEventListener('click', () => {
        if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
          $('greeting').textContent = 'Speech is not available in this browser.';
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance($('speech-box').textContent.trim());
          utterance.pitch = Number($('voice-pitch').value) || 1;
          utterance.rate = Number($('voice-rate').value) || 1;
          utterance.onstart = () => { $('greeting').textContent = 'Speaking…'; };
          utterance.onend = () => { $('greeting').textContent = 'Systems online!'; };
          utterance.onerror = () => { $('greeting').textContent = 'Tap Speak to try again.'; };
          window.speechSynthesis.speak(utterance);
          beep();
        } catch (_) { $('greeting').textContent = 'Tap Speak to try again.'; }
      });
      document.querySelectorAll('.mode-button').forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));
      $('open-settings').addEventListener('click', () => {
        beep();
        if (typeof dialog.showModal === 'function') dialog.showModal();
        else dialog.setAttribute('open', '');
      });
      document.querySelector('.close-button').addEventListener('click', () => {
        if (typeof dialog.close === 'function') dialog.close(); else dialog.removeAttribute('open');
      });
      for (const [id, outputId, key] of [['voice-pitch', 'pitch-value', 'suki_pitch'], ['voice-rate', 'rate-value', 'suki_rate']]) {
        const input = $(id);
        const saved = store.get(key);
        if (saved && Number.isFinite(Number(saved))) input.value = saved;
        $(outputId).value = Number(input.value).toFixed(1);
        input.addEventListener('input', () => {
          $(outputId).value = Number(input.value).toFixed(1);
          store.set(key, input.value);
        });
      }
      const matrixToggle = $('matrix-toggle');
      matrixToggle.checked = store.get('suki_matrix') === 'on';
      themeToggle.checked = store.get('suki_theme') === 'light';
      themeToggle.addEventListener('change', () => applyTheme(themeToggle.checked));
      applyTheme(store.get('suki_theme') === 'light');
      function resizeMatrix() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * ratio);
        canvas.height = Math.round(window.innerHeight * ratio);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        matrixDrops = Array(Math.ceil(window.innerWidth / 18)).fill(0);
      }
      function stopMatrix() {
        if (matrixFrame) cancelAnimationFrame(matrixFrame);
        matrixFrame = 0;
      }
      function drawMatrix() {
        if (!matrixToggle.checked || document.hidden || !ctx) { matrixFrame = 0; return; }
        ctx.fillStyle = 'rgba(10, 5, 20, .14)';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.fillStyle = '#c084fc';
        ctx.font = '12px monospace';
        const chars = '0123456789SUKIBOT';
        matrixDrops.forEach((drop, index) => {
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], index * 18, drop * 18);
          matrixDrops[index] = drop * 18 > window.innerHeight && Math.random() > .97 ? 0 : drop + 1;
        });
        matrixFrame = window.setTimeout(() => { matrixFrame = requestAnimationFrame(drawMatrix); }, 70);
      }
      function applyMatrix() {
        stopMatrix();
        canvas.classList.toggle('visible', matrixToggle.checked);
        store.set('suki_matrix', matrixToggle.checked ? 'on' : 'off');
        if (matrixToggle.checked && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          resizeMatrix();
          matrixFrame = requestAnimationFrame(drawMatrix);
        }
      }
      matrixToggle.addEventListener('change', applyMatrix);
      document.addEventListener('visibilitychange', () => { if (document.hidden) stopMatrix(); else applyMatrix(); });
      window.addEventListener('resize', () => { if (matrixToggle.checked) { stopMatrix(); resizeMatrix(); matrixFrame = requestAnimationFrame(drawMatrix); } }, { passive: true });
      const savedMode = store.get('suki_mode');
      setMode(['ASR', 'ORB', 'CORE', 'TACTICS'].includes(savedMode) ? savedMode : 'CORE');
      applyMatrix();
      updateClock();
      window.setInterval(updateClock, 15000);
    })();
  </script>
</body>
</html>
