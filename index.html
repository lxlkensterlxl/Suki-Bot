<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SukiBot companion console">
  <title>SukiBot — Companion Console</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 3.5 19.2 12.8 28.5 16l-9.3 3.2L16 28.5l-3.2-9.3L3.5 16l9.3-3.2L16 3.5Z" fill="currentColor"/><circle cx="16" cy="16" r="3.1" fill="#120a2a"/><path d="m25.4 4.2.9 2.5 2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9.9-2.5Z" fill="#67e8f9"/></svg></span><span>SUKI<span class="brand-accent">BOT</span></span></div>
      <span class="online"><i></i> READY</span>
      <button id="open-settings" class="icon-button" type="button" aria-label="Open settings">⚙</button>
    </header>

    <section class="intro">
      <p class="eyebrow">PERSONAL COMPANION // v2.6</p>
      <h1>Hey there, <span>Senpai.</span></h1>
      <p class="subheading">Your neon companion is ready.</p>
    </section>

    <section class="panel companion" aria-label="SukiBot status">
      <div class="avatar" id="suki-avatar" role="img" aria-label="Illustrated fox companion"><svg viewBox="0 0 120 120" width="76" height="76" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="fox-fur" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#f9a8d4"/><stop offset=".52" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="fox-light" x1="60" y1="55" x2="60" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient></defs><path d="M20 17 45 34 60 28 75 34 100 17 94 58c-1 26-15 44-34 51C41 100 27 82 26 58l-6-41Z" fill="url(#fox-fur)" stroke="#f5d0fe" stroke-width="2.5" stroke-linejoin="round"/><path d="m29 29 15 11-13 9-2-20Zm62 0L76 40l13 9 2-20Z" fill="#31204b"/><path d="M37 61c4-5 10-5 14 0m18 0c4-5 10-5 14 0" fill="none" stroke="#241735" stroke-width="4" stroke-linecap="round"/><path d="M39 71c6 0 12 3 21 9 9-6 15-9 21-9-3 15-11 24-21 24S42 86 39 71Z" fill="url(#fox-light)"/><path d="M56 70h8l-4 5-4-5Z" fill="#51304f"/><path d="M57 80c2 2 4 2 6 0" fill="none" stroke="#a8558b" stroke-width="2" stroke-linecap="round"/><path d="m16 52-6 3m100-3 6 3" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity=".8"/><path d="m19 76-7 1m96-1 7 1" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" opacity=".75"/></svg></div>
      <div><p class="eyebrow">SUKI / <span id="mode-display">CORE</span></p><h2 id="greeting">Systems online!</h2><p class="muted">A friendly little console for your day.</p></div>
    </section>

    <section class="panel transmission" aria-labelledby="transmission-title">
      <div class="section-heading"><h2 id="transmission-title">TRANSMISSION</h2><span id="synapse-clock">--:-- UTC</span></div>
      <p id="speech-box" class="message" aria-live="polite">Nya! Suki is online and ready to help.</p>
      <div class="actions">
        <button id="btn-transmit" class="button primary" type="button">↻ &nbsp;Transmit</button>
        <button id="btn-voice" class="button secondary" type="button">♫ &nbsp;Speak</button>
      </div>
    </section>

    <section class="panel modes" aria-labelledby="modes-title">
      <div class="section-heading"><h2 id="modes-title">QUICK MODES</h2><span class="hint">Tap to switch</span></div>
      <div class="mode-grid">
        <button class="mode-button" type="button" data-mode="ASR" aria-pressed="false"><span>◉</span>ASR</button>
        <button class="mode-button" type="button" data-mode="ORB" aria-pressed="false"><span>◌</span>Orb</button>
        <button class="mode-button" type="button" data-mode="CORE" aria-pressed="true"><span>✧</span>Core</button>
        <button class="mode-button" type="button" data-mode="TACTICS" aria-pressed="false"><span>⌁</span>Tactics</button>
      </div>
    </section>

    <footer class="app-footer"><span><i></i> All systems local</span><span id="energy-display">100% energy</span></footer>
  </main>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" class="settings-form">
      <div class="section-heading"><h2 id="settings-title">SETTINGS</h2><button class="icon-button close-button" value="close" aria-label="Close settings">×</button></div>
      <label class="setting-label" for="voice-pitch">Voice pitch <output id="pitch-value">1.0</output></label>
      <input id="voice-pitch" type="range" min="0.5" max="2" step="0.1" value="1">
      <label class="setting-label" for="voice-rate">Speaking speed <output id="rate-value">1.0</output></label>
      <input id="voice-rate" type="range" min="0.5" max="1.8" step="0.1" value="1">
      <label class="toggle-row" for="matrix-toggle"><span>Matrix background</span><input id="matrix-toggle" type="checkbox"></label>
      <button class="button primary done-button" value="done">Done</button>
    </form>
  </dialog>

  <script src="./suki-audio.js"></script>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const messages = [
        'Nya! Suki is online and ready to help.',
        'Tactical update: your next great idea is one small step away.',
        'Kitty matrix online. Remember to take a stretch break too.',
        'Energy core glowing! What would you like to build today?'
      ];
      let messageIndex = 0;
      let matrixFrame = 0;
      let matrixDrops = [];
      const canvas = $('matrix-canvas');
      const ctx = canvas.getContext('2d');
      const dialog = $('settings-dialog');
      const store = {
        get(key) { try { return localStorage.getItem(key); } catch (_) { return null; } },
        set(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
      };
      function beep() {
        try { if (window.sound) window.sound.playBeep(); } catch (_) {}
      }
      function setMode(mode) {
        mode = String(mode || 'CORE').toUpperCase();
        $('mode-display').textContent = mode;
        document.querySelectorAll('.mode-button').forEach((button) => {
          const active = button.dataset.mode === mode;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        store.set('suki_mode', mode);
        beep();
      }
      function updateClock() {
        const now = new Date();
        $('synapse-clock').textContent = `${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')} UTC`;
      }
      $('btn-transmit').addEventListener('click', () => {
        messageIndex = (messageIndex + 1) % messages.length;
        $('speech-box').textContent = messages[messageIndex];
        $('greeting').textContent = 'Transmission received!';
        beep();
      });
      $('btn-voice').addEventListener('click', () => {
        if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
          $('greeting').textContent = 'Speech is not available in this browser.';
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance($('speech-box').textContent.trim());
          utterance.pitch = Number($('voice-pitch').value) || 1;
          utterance.rate = Number($('voice-rate').value) || 1;
          utterance.onstart = () => { $('greeting').textContent = 'Speaking…'; };
          utterance.onend = () => { $('greeting').textContent = 'Systems online!'; };
          utterance.onerror = () => { $('greeting').textContent = 'Tap Speak to try again.'; };
          window.speechSynthesis.speak(utterance);
          beep();
        } catch (_) { $('greeting').textContent = 'Tap Speak to try again.'; }
      });
      document.querySelectorAll('.mode-button').forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));
      $('open-settings').addEventListener('click', () => {
        beep();
        if (typeof dialog.showModal === 'function') dialog.showModal();
        else dialog.setAttribute('open', '');
      });
      document.querySelector('.close-button').addEventListener('click', () => {
        if (typeof dialog.close === 'function') dialog.close(); else dialog.removeAttribute('open');
      });
      for (const [id, outputId, key] of [['voice-pitch', 'pitch-value', 'suki_pitch'], ['voice-rate', 'rate-value', 'suki_rate']]) {
        const input = $(id);
        const saved = store.get(key);
        if (saved && Number.isFinite(Number(saved))) input.value = saved;
        $(outputId).value = Number(input.value).toFixed(1);
        input.addEventListener('input', () => {
          $(outputId).value = Number(input.value).toFixed(1);
          store.set(key, input.value);
        });
      }
      const matrixToggle = $('matrix-toggle');
      matrixToggle.checked = store.get('suki_matrix') === 'on';
      function resizeMatrix() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * ratio);
        canvas.height = Math.round(window.innerHeight * ratio);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        matrixDrops = Array(Math.ceil(window.innerWidth / 18)).fill(0);
      }
      function stopMatrix() {
        if (matrixFrame) cancelAnimationFrame(matrixFrame);
        matrixFrame = 0;
      }
      function drawMatrix() {
        if (!matrixToggle.checked || document.hidden || !ctx) { matrixFrame = 0; return; }
        ctx.fillStyle = 'rgba(10, 5, 20, .14)';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.fillStyle = '#c084fc';
        ctx.font = '12px monospace';
        const chars = '0123456789SUKIBOT';
        matrixDrops.forEach((drop, index) => {
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], index * 18, drop * 18);
          matrixDrops[index] = drop * 18 > window.innerHeight && Math.random() > .97 ? 0 : drop + 1;
        });
        matrixFrame = window.setTimeout(() => { matrixFrame = requestAnimationFrame(drawMatrix); }, 70);
      }
      function applyMatrix() {
        stopMatrix();
        canvas.classList.toggle('visible', matrixToggle.checked);
        store.set('suki_matrix', matrixToggle.checked ? 'on' : 'off');
        if (matrixToggle.checked && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          resizeMatrix();
          matrixFrame = requestAnimationFrame(drawMatrix);
        }
      }
      matrixToggle.addEventListener('change', applyMatrix);
      document.addEventListener('visibilitychange', () => { if (document.hidden) stopMatrix(); else applyMatrix(); });
      window.addEventListener('resize', () => { if (matrixToggle.checked) { stopMatrix(); resizeMatrix(); matrixFrame = requestAnimationFrame(drawMatrix); } }, { passive: true });
      const savedMode = store.get('suki_mode');
      setMode(['ASR', 'ORB', 'CORE', 'TACTICS'].includes(savedMode) ? savedMode : 'CORE');
      applyMatrix();
      updateClock();
      window.setInterval(updateClock, 15000);
    })();
  </script>
</body>
</html>
