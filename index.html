<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SukiBot companion console">
  <title>SukiBot Companion Console</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="min-h-screen overflow-hidden bg-[var(--bg-surface,#120a2a)] text-[var(--text-primary,#ffffff)] antialiased">
  <canvas id="matrix-canvas" class="fixed inset-0 z-0 h-screen w-screen pointer-events-none opacity-0 transition-opacity duration-200 [&.visible]:opacity-100" aria-hidden="true"></canvas>
  
  <main class="relative z-[1] mx-auto flex min-h-dvh w-full max-w-[460px] flex-col gap-[14px] px-[14px] pt-[calc(12px+env(safe-area-inset-top))] pb-[calc(18px+env(safe-area-inset-bottom))] max-[430px]:px-[max(12px,env(safe-area-inset-left))] max-[430px]:pr-[max(12px,env(safe-area-inset-right))] max-[360px]:gap-3 max-[360px]:pt-[calc(10px+env(safe-area-inset-top))]">
    <!-- Header Navigation -->
    <header class="flex w-full items-center justify-between gap-2 rounded-[20px] border border-[var(--panel-border-soft,rgba(255,255,255,0.1))] bg-[rgba(12,7,20,0.66)] px-3 py-2 shadow-[0_0_18px_var(--glow,rgba(189,0,255,0.2))] backdrop-blur-xl transition-colors duration-200 max-[430px]:gap-1.5 max-[430px]:pl-2.5 max-[430px]:pr-2">
      <div class="inline-flex items-center gap-2 text-[0.95rem] font-extrabold tracking-[0.14em] max-[430px]:gap-1.5 max-[430px]:text-[0.82rem] max-[430px]:tracking-[0.12em]">
        <span class="inline-grid h-[22px] w-[22px] shrink-0 place-items-center text-cyan-300 drop-shadow-[0_0_12px_rgba(103,232,249,0.8)]" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 3.5 L19.2 12.8 L28.5 16 l-9.3 3.2 L16 28.5 l-3.2-9.3 L3.5 16 l9.3-3.2 Z" fill="currentColor"/>
            <circle cx="16" cy="16" r="3.1" fill="#120a2a"/>
          </svg>
        </span>
        <span>SUKI<span class="text-cyan-300">BOT</span></span>
      </div>
      <span class="inline-flex items-center gap-2 text-[0.72rem] font-extrabold tracking-[0.18em] text-cyan-300 max-[430px]:tracking-[0.12em]">
        <i class="inline-block h-2 w-2 rounded-full bg-[#80ffce] shadow-[0_0_12px_rgba(128,255,206,0.8)]"></i> READY
      </span>
      <button id="open-settings" class="grid h-9 w-9 shrink-0 place-items-center rounded-2xl border border-[var(--panel-border-soft,rgba(255,255,255,0.1))] bg-white/[0.03] text-[1.2rem] text-[var(--text-primary,#fff)] transition-colors duration-200" type="button" aria-label="Open settings">⚙️</button>
    </header>

    <!-- Header Greeting (Hey there, Senpai removed) -->
    <section class="grid gap-1.5 px-1">
      <p class="m-0 text-[0.7rem] font-bold tracking-[0.2em] text-[var(--text-secondary,#a1a1aa)]">PERSONAL COMPANION // v2.6</p>
      <p class="m-0 text-[0.95rem] text-[var(--text-secondary,#a1a1aa)]">Your neon companion is ready</p>
    </section>

    <!-- Status & Avatar Card -->
    <section class="grid grid-cols-[76px_minmax(0,1fr)] items-center gap-3 rounded-[20px] border border-[var(--panel-border,rgba(255,255,255,0.15))] bg-[var(--panel-surface,rgba(18,10,42,0.7))] p-3.5 shadow-[inset_0_0_12px_rgba(189,0,255,0.12),0_0_18px_var(--glow,rgba(189,0,255,0.2))] backdrop-blur-xl transition-colors duration-200 min-[431px]:grid-cols-[96px_minmax(0,1fr)] max-[360px]:p-3" aria-label="SukiBot status">
      <img id="suki-avatar-img" src="./suki-avatar.jpg" alt="Suki companion avatar" class="block h-[76px] w-[76px] rounded-[18px] border border-[var(--panel-border-soft,rgba(255,255,255,0.1))] object-cover object-top shadow-[0_0_12px_rgba(189,0,255,0.3)] min-[431px]:h-24 min-[431px]:w-24" />
      <div class="min-w-0">
        <p class="m-0 text-[0.7rem] font-bold tracking-[0.2em] text-[var(--text-secondary,#a1a1aa)] uppercase">Suki / ASR</p>
        <h2 class="m-0 text-[1.25rem] font-bold tracking-tight text-white">Systems online</h2>
        <p class="m-0 text-[0.82rem] text-[var(--text-secondary,#a1a1aa)]">A friendly little console for your day</p>
      </div>
    </section>
