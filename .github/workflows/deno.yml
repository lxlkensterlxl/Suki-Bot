name: iOS CI - iPhone 17

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    # 1. Switch from Ubuntu to macOS so Xcode and iOS Simulators are available
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. (Optional) If you use a community action to boot a specific simulator model explicitly:
      - name: Launch iOS Simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: 'iPhone 17'

      # 3. Replace Deno steps with your Xcode build or test command targeting iPhone 17
      - name: Run Build / Tests on iPhone 17 Simulator
        run: |
          xcodebuild test \
            -project YourProjectName.xcodeproj \
            -scheme YourSchemeName \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
