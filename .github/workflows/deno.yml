name: iOS CI - iPhone 17

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Optional: Select specific Xcode version if required by your project
      # - name: Select Xcode
      #   run: sudo xcode-select -s /Applications/Xcode.app

      - name: Launch iOS Simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: 'iPhone 17'
          # Optional: explicitly specify runtime version if needed (e.g., '19.0' or 'latest')
          # os: 'latest'

      - name: Run Build & Tests on iPhone 17 Simulator
        run: |
          xcodebuild test \
            -project YourProjectName.xcodeproj \
            -scheme YourSchemeName \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
